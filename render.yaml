databases:
  - name: doce-encanto-db
    plan: free
    databaseName: doce_encanto
    user: doce_encanto

services:
  - type: web
    plan: free
    name: doce-encanto-cupcakes
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn doce_encanto.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doce-encanto-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.12"

